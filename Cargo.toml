[package]
name = "remote-package"
version = "0.3.0"
edition = "2018"
authors = ["Max Dymond <cmeister2@gmail.com>"]
description = "A simple crate to query remote packages for information."
license = "MIT"
repository = "https://github.com/cmeister2/remote-package"
rust-version = "1.59"
keywords = ["rpm", "debian", "package"]
categories = ["development-tools"]

[dependencies]
debpkg = { version = "0.6.0", optional = true }
reqwest = { version = "0.13.0", features = ["blocking"], optional = true }
fez = { package = "fez", version = "0.8.1", default-features = false, features = ["async-tokio", "signature-meta"], optional = true }
futures = { version = "0.3", optional = true }
tokio-util = { version = "0.7", features = ["compat"], optional = true }
thiserror = "1.0.30"
infer = "0.22.0"

[features]
default = ["http", "debian", "rpm"]
http = [ "reqwest" ]
debian = [ "debpkg" ]
rpm = [ "fez", "futures", "tokio-util" ]
